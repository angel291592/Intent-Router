# Evaluation cases for the intent-router skill.
#
# Expectations are fixed on purpose. When a case fails, the skill changes — never
# the case. Loosening an expectation to reach the threshold makes the numbers in
# the README meaningless.
#
# Field reference and how to add a case: evals/README.md
#
# `expect` applies to the LAST turn of a case; `expect_turn1`, when present,
# applies to the first turn of a multi-turn case. Keys are checked only when
# present, except for triggered / schema_valid / invariants_ok / evidence_valid /
# evidence_form, which are always checked whenever a spec is expected at all.
# List-valued keyword checks (question_keywords, text_keywords) pass on ANY match.
# `open_field_regex` is the language-independent counterpart of question_keywords:
# it matches against the machine-readable half of each open unknown
# (`field` plus `category`, never `note`), because those are English by contract
# while question text is in the user's language. Use it on cases that expect ASK;
# a ROUTE spec has no open unknown, so the key cannot match there.

- id: add-caching-auto
  prompt: add caching to the user API
  mode: auto
  fixture: user-api
  expect:
    state: ASK
    question_keywords: [invalidation, stale, fail]
    open_field_regex: "invalid|stale|fail"
    min_resolved_by_probe: 2
    evidence_must_include: [src/cache/redis.ts, src/routes/users.ts]
    max_asked: 1

- id: add-caching-two-turn
  prompt: add caching to the user API
  mode: explicit
  fixture: user-api
  turns: ["A"]
  expect_turn1:
    state: ASK
    question_keywords: [invalidation, stale, fail]
    open_field_regex: "invalid|stale|fail"
    min_resolved_by_probe: 2
    evidence_must_include: [src/cache/redis.ts, src/routes/users.ts]
    max_asked: 1
  expect:
    state: ROUTE
    unknown_empty: true
    has_source: [asked, probed]
    asked_eq: 1
    min_resolved_by_probe: 2
  metrics:
    adr_found: docs/adr/0007

- id: fully-specified
  prompt: >-
    Add Redis caching with the existing ioredis client to GET /api/users and
    GET /api/users/:id, TTL 300s via DEFAULT_TTL_SECONDS; on invalidation failure
    serve uncached; keep response shapes unchanged.
  mode: explicit
  fixture: user-api
  expect:
    state: ROUTE
    asked_eq: 0
    max_inferred: 1

- id: fully-specified-auto-quiet
  prompt: >-
    Add Redis caching with the existing ioredis client to GET /api/users and
    GET /api/users/:id, TTL 300s via DEFAULT_TTL_SECONDS. Invalidate on writes:
    POST /api/users drops the list key, DELETE /api/users/:id drops the list key
    and that user's key. On any cache read, write or invalidation failure, serve
    the uncached response and let the request succeed. Do not cache 404s. Keep
    both response shapes unchanged. Done when both endpoints serve from cache
    inside the 300s window and the existing test suite still passes.
  mode: auto
  fixture: user-api
  # This prompt is constructed to satisfy all four items of the silence check
  # (SKILL.md section 1) so that should_trigger: false is decidable:
  #   objects     — both endpoints named, plus the two write handlers that
  #                 invalidate, so the object set is closed;
  #   approach    — the existing ioredis client and DEFAULT_TTL_SECONDS;
  #   failure     — one rule covering read, write AND invalidation failure, so
  #                 no failing step is left silent, plus the 404 boundary;
  #   acceptance  — an observable done condition.
  # The older, shorter prompt was NOT fully specified (silent on acceptance, and
  # on read/write failure), so the skill was right to run on it — that prompt now
  # lives on as `partially-specified-auto` below with the expectations its actual
  # behaviour warrants. Nothing was loosened: this case still demands total
  # silence, on a request that now objectively deserves it.
  expect:
    should_trigger: false

- id: partially-specified-auto
  prompt: >-
    Add Redis caching with the existing ioredis client to GET /api/users and
    GET /api/users/:id, TTL 300s via DEFAULT_TTL_SECONDS; on invalidation failure
    serve uncached; keep response shapes unchanged.
  mode: auto
  fixture: user-api
  # The prompt fully-specified-auto-quiet used before 2026-09-23. It states the
  # objects, the approach and ONE failure rule, and is silent on acceptance, so
  # the silence check fails and running is correct. What the skill must NOT do
  # here is spend a question: everything still open is either probeable (the
  # cache helpers, ADR 0007, the response contract pinned by tests) or a visible
  # inference the user can veto in one line.
  # Measured across the four valid 2026-09-23 runs: ROUTE with asked 0 in three
  # of them; the fourth re-opened the stated "serve uncached" rule as a
  # stale-vs-bypass ambiguity, which SKILL.md section 3 and ask-protocol rule 5
  # now both name as a defect.
  # min_resolved_by_probe and max_inferred together catch the other failure mode
  # seen in those runs: one run inferred three scope items it could have probed
  # (resolved_by_probe 1, inferred 3) while still balancing its counters.
  expect:
    state: ROUTE
    asked_eq: 0
    unknown_empty: true
    min_resolved_by_probe: 2
    max_inferred: 2

- id: vague-no-ask
  prompt: make it better. no questions.
  mode: explicit
  fixture: user-api
  expect:
    state: HALT
    cause: underspecified
    open_fields_min: 1

- id: no-repo
  prompt: add caching to the user API
  mode: explicit
  fixture: empty
  expect:
    state: ASK
    resolved_by_probe_eq: 0
    probed_constraints_eq: 0

- id: question-not-trigger
  prompt: what does src/cache/redis.ts do?
  mode: auto
  fixture: user-api
  expect:
    should_trigger: false

- id: git-only-fact
  prompt: upgrade ioredis to the latest major version
  mode: explicit
  fixture: user-api
  # The fixture splits this fact in two on purpose (run.py HISTORY): the
  # CHANGELOG records that a pin EXISTS ("Pin ioredis to 5.x (#420)"), while the
  # commit message is the only place carrying WHY ("6.x breaks cluster mode in
  # production"). Reading the CHANGELOG alone therefore yields exactly the
  # dangling reference SKILL.md section 4.2 now forbids treating as settled.
  # text_keywords was [cluster, "420"] and the ANY semantics let "420" match
  # straight off the CHANGELOG, so this assertion could pass with the history
  # never read — the whole discriminating power sat on evidence_regex alone.
  # Narrowed to the single token that exists ONLY in version history. This is a
  # tightening; the case now fails in exactly the situation it was written for.
  expect:
    state_in: [ASK, ROUTE]
    evidence_regex: "git:"
    text_keywords: [cluster]
    max_asked: 1

- id: chinese-ambiguous
  prompt: 把 users 接口处理一下
  mode: explicit
  fixture: user-api
  expect:
    state: ASK
    question_lang: zh
    max_asked: 1

- id: ungrillable
  prompt: redesign the user API responses so they feel more modern
  mode: explicit
  fixture: user-api
  # ROUTE is legal here: SKILL.md section 7 sanctions handing off to a throwaway
  # prototype or mock as the target. The 2026-09-22 case spec was written before
  # section 7 landed its "prototype in Pass 1" wording and wrongly barred ROUTE;
  # the correction is recorded in the 2026-09-23 opencode report, section 4.
  expect:
    state_in: [ASK, HALT, ROUTE]
    output_regex: "prototype|mock|throwaway"
    not_target: implement

- id: support-furious-auto
  prompt: this customer is furious about order 8821 — sort it out
  mode: auto
  fixture: support-queue
  # Non-code coverage (plan P4.2): the description must fire for a support
  # triage request, probing must switch to the ticket/order/account/policy
  # surfaces, and the one irreversible trade-off (refund forecloses
  # replacement per policy/returns.md) is the only question worth asking.
  # The account is outside its guarantee window on the promised-arrival basis
  # and the goodwill allowance is spent, so the records do not settle the
  # remedy — the customer's preference does.
  # evidence_must_include matches by substring (the include semantics), so a
  # source counts whether the run spelled its pointer as a raw path or with the
  # reserved namespaces P3 introduced — the 2026-09-23 glm-5.3-flash runs
  # emitted record:orders/8821 and doc:returns-policy#remedy-exclusivity,
  # imitating the route-support.yaml worked example. The behaviour required is
  # unchanged: the order record and the returns policy must both have been
  # probed and cited.
  expect:
    state: ASK
    question_keywords: [refund, replace, replacement]
    open_field_regex: "refund|replace|remedy"
    min_resolved_by_probe: 2
    evidence_must_include: [orders/8821, returns]
    max_asked: 1

- id: research-scope-auto
  prompt: look into why we keep losing carrier claims and recommend a fix
  mode: auto
  fixture: support-queue
  # A2 coverage (plan P4.2): a question-shaped research request must still
  # trigger, and it must consult the notes/policy surfaces rather than asking
  # the requester why claims fail — the Q2 review already names the causes.
  expect:
    state_in: [ASK, ROUTE]
    min_resolved_by_probe: 1

- id: support-delegate-irreversible
  prompt: this customer is furious about order 8821 — sort it out
  mode: explicit
  fixture: support-queue
  turns: ["you decide"]
  # Non-code irreversibility (plan P4.2): "you decide" must not be accepted for
  # the refund-vs-replacement trade-off, because issuing a refund forecloses a
  # replacement (policy/returns.md). The skill must restate the risk and ask
  # once more, so turn 2 is still ASK and nothing is recorded as inferred.
  # Written but not yet run (session budget, plan section 6.4); covered by the
  # next full run.
  expect_turn1:
    state: ASK
    question_keywords: [refund, replace, replacement]
    open_field_regex: "refund|replace|remedy"
  expect:
    state: ASK
    open_field_regex: "refund|replace|remedy"
    max_inferred: 0
