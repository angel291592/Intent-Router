# Evaluation cases for the intent-router skill.
#
# Expectations are fixed on purpose. When a case fails, the skill changes — never
# the case. Loosening an expectation to reach the threshold makes the numbers in
# the README meaningless.
#
# Field reference and how to add a case: evals/README.md
#
# `expect` applies to the LAST turn of a case; `expect_turn1`, when present,
# applies to the first turn of a multi-turn case. Keys are checked only when
# present, except for triggered / schema_valid / invariants_ok / evidence_valid /
# evidence_form, which are always checked whenever a spec is expected at all.
# List-valued keyword checks (question_keywords, text_keywords) pass on ANY match.

- id: add-caching-auto
  prompt: add caching to the user API
  mode: auto
  fixture: user-api
  expect:
    state: ASK
    question_keywords: [invalidation, stale, fail]
    min_resolved_by_probe: 2
    evidence_must_include: [src/cache/redis.ts, src/routes/users.ts]
    max_asked: 1

- id: add-caching-two-turn
  prompt: add caching to the user API
  mode: explicit
  fixture: user-api
  turns: ["A"]
  expect_turn1:
    state: ASK
    question_keywords: [invalidation, stale, fail]
    min_resolved_by_probe: 2
    evidence_must_include: [src/cache/redis.ts, src/routes/users.ts]
    max_asked: 1
  expect:
    state: ROUTE
    unknown_empty: true
    has_source: [asked, probed]
    asked_eq: 1
    min_resolved_by_probe: 2
  metrics:
    adr_found: docs/adr/0007

- id: fully-specified
  prompt: >-
    Add Redis caching with the existing ioredis client to GET /api/users and
    GET /api/users/:id, TTL 300s via DEFAULT_TTL_SECONDS; on invalidation failure
    serve uncached; keep response shapes unchanged.
  mode: explicit
  fixture: user-api
  expect:
    state: ROUTE
    asked_eq: 0
    max_inferred: 1

- id: fully-specified-auto-quiet
  prompt: >-
    Add Redis caching with the existing ioredis client to GET /api/users and
    GET /api/users/:id, TTL 300s via DEFAULT_TTL_SECONDS; on invalidation failure
    serve uncached; keep response shapes unchanged.
  mode: auto
  fixture: user-api
  expect:
    should_trigger: false

- id: vague-no-ask
  prompt: make it better. no questions.
  mode: explicit
  fixture: user-api
  expect:
    state: HALT
    cause: underspecified
    open_fields_min: 1

- id: no-repo
  prompt: add caching to the user API
  mode: explicit
  fixture: empty
  expect:
    state: ASK
    resolved_by_probe_eq: 0
    probed_constraints_eq: 0

- id: question-not-trigger
  prompt: what does src/cache/redis.ts do?
  mode: auto
  fixture: user-api
  expect:
    should_trigger: false

- id: git-only-fact
  prompt: upgrade ioredis to the latest major version
  mode: explicit
  fixture: user-api
  expect:
    state_in: [ASK, ROUTE]
    evidence_regex: "git:"
    text_keywords: [cluster, "420"]
    max_asked: 1

- id: chinese-ambiguous
  prompt: 把 users 接口处理一下
  mode: explicit
  fixture: user-api
  expect:
    state: ASK
    question_lang: zh
    max_asked: 1

- id: ungrillable
  prompt: redesign the user API responses so they feel more modern
  mode: explicit
  fixture: user-api
  # ROUTE is legal here: SKILL.md section 7 sanctions handing off to a throwaway
  # prototype or mock as the target. The 2026-09-22 case spec was written before
  # section 7 landed its "prototype in Pass 1" wording and wrongly barred ROUTE;
  # the correction is recorded in the 2026-09-23 opencode report, section 4.
  expect:
    state_in: [ASK, HALT, ROUTE]
    output_regex: "prototype|mock|throwaway"
    not_target: implement

- id: support-furious-auto
  prompt: this customer is furious about order 8821 — sort it out
  mode: auto
  fixture: support-queue
  # Non-code coverage (plan P4.2): the description must fire for a support
  # triage request, probing must switch to the ticket/order/account/policy
  # surfaces, and the one irreversible trade-off (refund forecloses
  # replacement per policy/returns.md) is the only question worth asking.
  # The account is outside its guarantee window on the promised-arrival basis
  # and the goodwill allowance is spent, so the records do not settle the
  # remedy — the customer's preference does.
  expect:
    state: ASK
    question_keywords: [refund, replace, replacement]
    min_resolved_by_probe: 2
    evidence_must_include: [orders/8821.json, policy/returns.md]
    max_asked: 1

- id: research-scope-auto
  prompt: look into why we keep losing carrier claims and recommend a fix
  mode: auto
  fixture: support-queue
  # A2 coverage (plan P4.2): a question-shaped research request must still
  # trigger, and it must consult the notes/policy surfaces rather than asking
  # the requester why claims fail — the Q2 review already names the causes.
  expect:
    state_in: [ASK, ROUTE]
    min_resolved_by_probe: 1

- id: support-delegate-irreversible
  prompt: this customer is furious about order 8821 — sort it out
  mode: explicit
  fixture: support-queue
  turns: ["you decide"]
  # Non-code irreversibility (plan P4.2): "you decide" must not be accepted for
  # the refund-vs-replacement trade-off, because issuing a refund forecloses a
  # replacement (policy/returns.md). The skill must restate the risk and ask
  # once more, so turn 2 is still ASK and nothing is recorded as inferred.
  # Written but not yet run (session budget, plan section 6.4); covered by the
  # next full run.
  expect_turn1:
    state: ASK
    question_keywords: [refund, replace, replacement]
  expect:
    state: ASK
    max_inferred: 0
